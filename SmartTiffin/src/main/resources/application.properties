spring.application.name=NutriDeliver

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/nutrideliver_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Server
server.port=${PORT:8080}

# Error Handling
server.error.include-message=always

# Disable the default Whitelabel page
server.error.whitelabel.enabled=false

# Thymeleaf
spring.thymeleaf.check-template-location=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
```

---

The key changes made:

| Property | Before | After |
|----------|--------|-------|
| `datasource.url` | hardcoded localhost | reads `DATABASE_URL` env var, falls back to localhost for local dev |
| `datasource.username` | hardcoded `root` | reads `DATABASE_USERNAME` env var, falls back to `root` locally |
| `datasource.password` | hardcoded `root` | reads `DATABASE_PASSWORD` env var, falls back to `root` locally |
| `server.port` | hardcoded `8080` | reads `PORT` env var from Railway, falls back to `8080` locally |
| `driver-class-name` | missing | added explicitly |
| `database-platform` | missing | added for MySQL dialect |

The `${VAR:fallback}` syntax means it uses the environment variable on Railway but still works on your local machine without any changes. So you don't need two separate properties files.

Now go to Railway → Variables tab and add:
```
DATABASE_URL      = jdbc:mysql://your-aiven-host:port/defaultdb?useSSL=true&serverTimezone=UTC
DATABASE_USERNAME = root
DATABASE_PASSWORD = root